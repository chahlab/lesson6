<!DOCTYPE html>
<html>
    <head>
        <title> My Doctor's Appointement</title>
    </head>

    <body>
     <h1>My doctor's Appointement</h1>
     <p>Welcome. Please fill out the form to book an appointement</p>
     <hr>
     <form>
        <fieldset>
            <legend>Personal details</legend>
            <label for="name">Full name:</label>
            <input type="text" id="name" placeholder="enter your full name"><br><br>


            <label for="patient_id">patient id:</label>
            <input type="password"  id="patient_id"placeholder="enter your id"><br><br>

            <label for="dob" > date of birth:</label>
            <input type="date" id="dob">
            


        </fieldset><br>


        <fieldset>
            <legend> Your visit</legend>
            <label for="doctor">choose a doctor</label>
            <select id="doctor" name="doctor">
                <option value=" doctor_chahla">Doctor Chahla</option>
                <option value="ttt">ttt</option>
                <option value="yyy">yyyy</option>
            </select>
            
         
         




        </fieldset>





     </form>





    </body>

</html>
